<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FocusFlow — Interactive Task & Pomodoro App</title>
  <style>
    :root {
      --bg: #0f172a;
      --surface: #1e293b;
      --surface-hover: #273549;
      --text: #f8fafc;
      --muted: #94a3b8;
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --border: #334155;
      --success: #22c55e;
      --danger: #ef4444;
      --high: #f97316;
      --medium: #38bdf8;
      --low: #a3e635;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.5;
      min-height: 100vh;
      padding: 1.5rem;
    }

    .app-container {
      max-width: 960px;
      margin: 0 auto;
    }

    .app-header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      margin-bottom: 1.5rem;
    }

    .subtitle {
      color: var(--muted);
      font-size: 0.95rem;
    }

    .stats-bar {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      color: var(--muted);
      font-size: 0.9rem;
    }

    .main-grid {
      display: grid;
      grid-template-columns: 1fr 1.35fr;
      gap: 1.5rem;
      align-items: start;
    }

    .card {
      background-color: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 1.5rem;
    }

    /* Timer Styles */
    .mode-switch {
      display: flex;
      gap: 0.4rem;
      background: var(--bg);
      padding: 0.3rem;
      border-radius: 10px;
      margin-bottom: 1.5rem;
    }

    .mode-btn {
      flex: 1;
      background: transparent;
      color: var(--muted);
      border: none;
      padding: 0.5rem;
      border-radius: 7px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s, color 0.2s;
    }

    .mode-btn.active {
      background: var(--primary);
      color: #fff;
    }

    .timer-display {
      font-size: clamp(3rem, 7vw, 4.25rem);
      font-weight: 700;
      text-align: center;
      font-variant-numeric: tabular-nums;
      letter-spacing: 2px;
      margin: 0.5rem 0;
    }

    .active-task-label {
      text-align: center;
      color: var(--muted);
      font-size: 0.9rem;
      min-height: 1.4rem;
      margin-bottom: 1.5rem;
    }

    .timer-controls {
      display: flex;
      justify-content: center;
      gap: 0.75rem;
    }

    /* Buttons & Inputs */
    .btn {
      border: none;
      border-radius: 8px;
      padding: 0.6rem 1.1rem;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s, opacity 0.2s;
    }

    .btn-primary {
      background-color: var(--primary);
      color: #fff;
    }

    .btn-primary:hover {
      background-color: var(--primary-hover);
    }

    .btn-secondary {
      background-color: var(--border);
      color: var(--text);
    }

    .btn-secondary:hover {
      background-color: #475569;
    }

    .btn-ghost {
      background: transparent;
      color: var(--muted);
      border: 1px solid var(--border);
      padding: 0.35rem 0.7rem;
      font-size: 0.8rem;
    }

    .btn-ghost:hover {
      color: var(--text);
      border-color: var(--muted);
    }

    .task-form {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1rem;
    }

    .task-form input,
    .task-form select {
      background-color: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.6rem 0.75rem;
      font-size: 0.9rem;
    }

    .task-form input {
      flex: 1;
      min-width: 0;
    }

    .task-form input:focus,
    .task-form select:focus {
      outline: 2px solid var(--primary);
      outline-offset: -1px;
    }

    /* Filter Bar */
    .filter-bar {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1rem;
      border-bottom: 1px solid var(--border);
      padding-bottom: 0.75rem;
    }

    .filter-btn {
      background: transparent;
      border: none;
      color: var(--muted);
      font-size: 0.85rem;
      font-weight: 600;
      padding: 0.35rem 0.7rem;
      border-radius: 6px;
      cursor: pointer;
    }

    .filter-btn.active {
      background-color: var(--surface-hover);
      color: var(--text);
    }

    /* Task List */
    .task-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }

    .task-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      background-color: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 0.75rem 0.9rem;
    }

    .task-item.selected {
      border-color: var(--primary);
    }

    .task-left {
      display: flex;
      align-items: center;
      gap: 0.65rem;
      min-width: 0;
      flex: 1;
    }

    .task-checkbox {
      width: 18px;
      height: 18px;
      accent-color: var(--success);
      cursor: pointer;
    }

    .task-title {
      word-break: break-word;
      font-size: 0.95rem;
    }

    .task-item.completed .task-title {
      text-decoration: line-through;
      color: var(--muted);
    }

    .badge {
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      padding: 0.15rem 0.45rem;
      border-radius: 999px;
      flex-shrink: 0;
    }

    .badge-high {
      background-color: rgba(249, 115, 22, 0.18);
      color: var(--high);
    }

    .badge-medium {
      background-color: rgba(56, 189, 248, 0.18);
      color: var(--medium);
    }

    .badge-low {
      background-color: rgba(163, 230, 53, 0.18);
      color: var(--low);
    }

    .task-actions {
      display: flex;
      gap: 0.35rem;
      flex-shrink: 0;
    }

    .icon-btn {
      background: transparent;
      border: 1px solid transparent;
      color: var(--muted);
      border-radius: 6px;
      padding: 0.3rem 0.5rem;
      font-size: 0.8rem;
      cursor: pointer;
    }

    .icon-btn:hover {
      background-color: var(--surface-hover);
      color: var(--text);
    }

    .icon-btn.delete:hover {
      color: var(--danger);
    }

    .empty-state {
      text-align: center;
      color: var(--muted);
      padding: 1.5rem 0;
      font-size: 0.9rem;
    }

    @media (max-width: 780px) {
      .main-grid {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 480px) {
      body {
        padding: 1rem;
      }

      .task-form {
        flex-wrap: wrap;
      }

      .task-form input {
        flex-basis: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="app-container">
    <header class="app-header">
      <div>
        <h1>FocusFlow</h1>
        <p class="subtitle">Interactive Task Manager & Focus Timer</p>
      </div>
      <div class="stats-bar">
        <span id="completed-count">0 completed</span>
        <button id="clear-completed-btn" class="btn btn-ghost" type="button">
          Clear Done
        </button>
      </div>
    </header>

    <main class="main-grid">
      <section class="card timer-card" aria-label="Focus Timer">
        <div class="mode-switch">
          <button class="mode-btn active" data-minutes="25" type="button">Focus (25m)</button>
          <button class="mode-btn" data-minutes="5" type="button">Short Break (5m)</button>
          <button class="mode-btn" data-minutes="15" type="button">Long Break (15m)</button>
        </div>

        <div class="timer-display" id="timer-display">25:00</div>
        <p class="active-task-label" id="active-task-label">No task selected for focus</p>

        <div class="timer-controls">
          <button id="start-pause-btn" class="btn btn-primary" type="button">Start</button>
          <button id="reset-timer-btn" class="btn btn-secondary" type="button">Reset</button>
        </div>
      </section>

      <section class="card tasks-card" aria-label="Task Manager">
        <form id="task-form" class="task-form">
          <input
            type="text"
            id="task-input"
            placeholder="Add a new task..."
            maxlength="120"
            required
          />
          <select id="priority-select" aria-label="Task Priority">
            <option value="medium">Medium</option>
            <option value="high">High</option>
            <option value="low">Low</option>
          </select>
          <button type="submit" class="btn btn-primary">Add</button>
        </form>

        <div class="filter-bar">
          <button class="filter-btn active" data-filter="all" type="button">All</button>
          <button class="filter-btn" data-filter="active" type="button">Active</button>
          <button class="filter-btn" data-filter="completed" type="button">Completed</button>
        </div>

        <ul id="task-list" class="task-list"></ul>
      </section>
    </main>
  </div>

  <script>
    const STORAGE_KEY = "focusflow_state_v1";

    const state = {
      tasks: [],
      filter: "all",
      selectedTaskId: null,
      timerSeconds: 25 * 60,
      selectedMinutes: 25,
      isRunning: false,
    };

    let timerInterval = null;

    const taskForm = document.getElementById("task-form");
    const taskInput = document.getElementById("task-input");
    const prioritySelect = document.getElementById("priority-select");
    const taskList = document.getElementById("task-list");
    const filterButtons = document.querySelectorAll(".filter-btn");
    const completedCountEl = document.getElementById("completed-count");
    const clearCompletedBtn = document.getElementById("clear-completed-btn");

    const timerDisplay = document.getElementById("timer-display");
    const activeTaskLabel = document.getElementById("active-task-label");
    const startPauseBtn = document.getElementById("start-pause-btn");
    const resetTimerBtn = document.getElementById("reset-timer-btn");
    const modeButtons = document.querySelectorAll(".mode-btn");

    function loadState() {
      try {
        const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
        if (saved && Array.isArray(saved.tasks)) {
          state.tasks = saved.tasks;
          state.filter = saved.filter || "all";
          state.selectedTaskId = saved.selectedTaskId || null;
          state.selectedMinutes = Number(saved.selectedMinutes) || 25;
          state.timerSeconds =
            typeof saved.timerSeconds === "number"
              ? saved.timerSeconds
              : state.selectedMinutes * 60;
        }
      } catch (err) {
        console.warn("Could not load saved state:", err);
      }
    }

    function saveState() {
      try {
        localStorage.setItem(
          STORAGE_KEY,
          JSON.stringify({
            tasks: state.tasks,
            filter: state.filter,
            selectedTaskId: state.selectedTaskId,
            selectedMinutes: state.selectedMinutes,
            timerSeconds: state.timerSeconds,
          })
        );
      } catch (err) {
        console.warn("Could not save state:", err);
      }
    }

    function formatTime(totalSeconds) {
      const mins = Math.floor(totalSeconds / 60);
      const secs = totalSeconds % 60;
      return `${String(mins).padStart(2, "0")}:${String(secs).padStart(2, "0")}`;
    }

    function updateTimerUI() {
      timerDisplay.textContent = formatTime(state.timerSeconds);
      startPauseBtn.textContent = state.isRunning ? "Pause" : "Start";
      document.title = state.isRunning
        ? `${formatTime(state.timerSeconds)} — FocusFlow`
        : "FocusFlow — Interactive Task & Pomodoro App";

      const selectedTask = state.tasks.find((t) => t.id === state.selectedTaskId);
      activeTaskLabel.textContent = selectedTask
        ? `Focusing on: ${selectedTask.title}`
        : "No task selected for focus";

      modeButtons.forEach((btn) => {
        btn.classList.toggle("active", Number(btn.dataset.minutes) === state.selectedMinutes);
      });
    }

    function startTimer() {
      if (state.isRunning || state.timerSeconds <= 0) return;
      state.isRunning = true;
      updateTimerUI();

      timerInterval = setInterval(() => {
        if (state.timerSeconds > 0) {
          state.timerSeconds -= 1;
          updateTimerUI();
          saveState();
        } else {
          pauseTimer();
          alert("Focus session complete! Take a well-earned break.");
        }
      }, 1000);
    }

    function pauseTimer() {
      state.isRunning = false;
      clearInterval(timerInterval);
      timerInterval = null;
      updateTimerUI();
      saveState();
    }

    function resetTimer() {
      pauseTimer();
      state.timerSeconds = state.selectedMinutes * 60;
      updateTimerUI();
      saveState();
    }

    function renderTasks() {
      const completedCount = state.tasks.filter((t) => t.completed).length;
      completedCountEl.textContent = `${completedCount} completed`;

      filterButtons.forEach((btn) => {
        btn.classList.toggle("active", btn.dataset.filter === state.filter);
      });

      const filteredTasks = state.tasks.filter((task) => {
        if (state.filter === "active") return !task.completed;
        if (state.filter === "completed") return task.completed;
        return true;
      });

      taskList.innerHTML = "";

      if (filteredTasks.length === 0) {
        const empty = document.createElement("li");
        empty.className = "empty-state";
        empty.textContent = "No tasks match this view.";
        taskList.appendChild(empty);
        return;
      }

      filteredTasks.forEach((task) => {
        const li = document.createElement("li");
        li.className = `task-item ${task.completed ? "completed" : ""} ${
          task.id === state.selectedTaskId ? "selected" : ""
        }`;

        const left = document.createElement("div");
        left.className = "task-left";

        const checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.className = "task-checkbox";
        checkbox.checked = task.completed;
        checkbox.setAttribute("aria-label", `Mark "${task.title}" as completed`);
        checkbox.addEventListener("change", () => toggleTask(task.id));

        const titleSpan = document.createElement("span");
        titleSpan.className = "task-title";
        titleSpan.textContent = task.title;

        const badge = document.createElement("span");
        badge.className = `badge badge-${task.priority}`;
        badge.textContent = task.priority;

        left.append(checkbox, titleSpan, badge);

        const actions = document.createElement("div");
        actions.className = "task-actions";

        const focusBtn = document.createElement("button");
        focusBtn.type = "button";
        focusBtn.className = "icon-btn";
        focusBtn.textContent = task.id === state.selectedTaskId ? "Focusing" : "Focus";
        focusBtn.addEventListener("click", () => selectTaskForFocus(task.id));

        const deleteBtn = document.createElement("button");
        deleteBtn.type = "button";
        deleteBtn.className = "icon-btn delete";
        deleteBtn.textContent = "✕";
        deleteBtn.setAttribute("aria-label", `Delete "${task.title}"`);
        deleteBtn.addEventListener("click", () => deleteTask(task.id));

        actions.append(focusBtn, deleteBtn);
        li.append(left, actions);
        taskList.appendChild(li);
      });
    }

    function addTask(title, priority) {
      const newTask = {
        id: crypto.randomUUID ? crypto.randomUUID() : String(Date.now() + Math.random()),
        title: title.trim(),
        priority,
        completed: false,
      };
      state.tasks.unshift(newTask);
      if (!state.selectedTaskId) {
        state.selectedTaskId = newTask.id;
      }
      saveState();
      renderTasks();
      updateTimerUI();
    }

    function toggleTask(id) {
      const task = state.tasks.find((t) => t.id === id);
      if (!task) return;
      task.completed = !task.completed;
      saveState();
      renderTasks();
    }

    function deleteTask(id) {
      state.tasks = state.tasks.filter((t) => t.id !== id);
      if (state.selectedTaskId === id) {
        state.selectedTaskId = state.tasks[0]?.id || null;
      }
      saveState();
      renderTasks();
      updateTimerUI();
    }

    function selectTaskForFocus(id) {
      state.selectedTaskId = state.selectedTaskId === id ? null : id;
      saveState();
      renderTasks();
      updateTimerUI();
    }

    taskForm.addEventListener("submit", (e) => {
      e.preventDefault();
      const value = taskInput.value.trim();
      if (!value) return;
      addTask(value, prioritySelect.value);
      taskInput.value = "";
      taskInput.focus();
    });

    filterButtons.forEach((btn) => {
      btn.addEventListener("click", () => {
        state.filter = btn.dataset.filter;
        saveState();
        renderTasks();
      });
    });

    clearCompletedBtn.addEventListener("click", () => {
      state.tasks = state.tasks.filter((t) => !t.completed);
      if (state.selectedTaskId && !state.tasks.some((t) => t.id === state.selectedTaskId)) {
        state.selectedTaskId = state.tasks[0]?.id || null;
      }
      saveState();
      renderTasks();
      updateTimerUI();
    });

    startPauseBtn.addEventListener("click", () => {
      if (state.isRunning) {
        pauseTimer();
      } else {
        startTimer();
      }
    });

    resetTimerBtn.addEventListener("click", resetTimer);

    modeButtons.forEach((btn) => {
      btn.addEventListener("click", () => {
        pauseTimer();
        state.selectedMinutes = Number(btn.dataset.minutes);
        state.timerSeconds = state.selectedMinutes * 60;
        updateTimerUI();
        saveState();
      });
    });

    loadState();
    renderTasks();
    updateTimerUI();
  </script>
</body>
</html>
